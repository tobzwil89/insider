<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Weiterleitung · Insider-Monitor</title>
  <link rel="stylesheet" href="style.css?v=aad8d2c8">
  <!-- Alte Adresse firma.html?t=TICKER (z. B. aus Telegram-Nachrichten) → neue Adresse firma/TICKER/ -->
  <script>
    const t = new URLSearchParams(location.search).get("t") || "";
    location.replace(/^[A-Z0-9.\-]{1,15}$/.test(t) ? `firma/${t}/` : "./");
  </script>
</head>
<body>
  <main><p>Weiter zur <a href="./">Startseite</a>.</p></main>
</body>
</html>
