# Per Knopfdruck: Stimmrechtsmitteilungen seit 2018 aus dem EQS-Archiv nachladen.
# Speichert nach jeder Firma; ein erneuter Start macht dort weiter, wo der letzte aufgehört hat.
# Abbrechen ist jederzeit möglich ("Cancel workflow"): Das bis dahin Geladene wird trotzdem gespeichert.
# Täglich nachts: nur neue Mitteilungen der letzten 14 Tage (dauert ~15 Minuten, deshalb nicht in "Daten aktualisieren").
name: Stimmrechte laden

on:
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:
    inputs:
      max_minuten:
        description: "Höchstens so viele Minuten laden"
        default: "320"
      alt:
        description: "Archiv vor 2018 laden (statt ab 2018)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: stimmrechte
  cancel-in-progress: false

jobs:
  laden:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Stimmrechte laden
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python stimmrechte_laden.py --tage 14 --max-minuten 60
          else
            python stimmrechte_laden.py --max-minuten "${{ inputs.max_minuten }}" ${{ inputs.alt && '--alt' || '' }}
          fi

      # Auch nach Fehler oder Abbruch speichern, was bis dahin geladen wurde
      - name: Ergebnis speichern
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daten/stimmrechte*.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nichts Neues"
          else
            git commit -m "Stimmrechte $(TZ=Europe/Berlin date '+%d.%m.%Y %H:%M')"
            git pull --rebase
            git push
          fi
